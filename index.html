<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双色球动态摇奖机</title><style>
:root{--bg:#081225;--gold:#f6c878;--red:#e33c57;--blue:#3289ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#203c60 0%,#0a1730 45%,#060d1d 100%);font-family:system-ui,'Microsoft Yahei',sans-serif;color:white;min-height:100vh}.wrap{width:min(950px,96vw);margin:0 auto;padding:28px 0 35px;text-align:center}h1{font-size:clamp(26px,5vw,40px);margin:6px 0;color:#ffe5ad;letter-spacing:3px}p.sub{color:#9eb4d6;margin:6px 0 22px}.stage{position:relative;height:440px;max-width:760px;margin:auto;border-radius:30px;background:linear-gradient(130deg,#172e4d,#0b192f);border:1px solid #38506d;box-shadow:inset 0 0 80px #030b1a,0 24px 50px #0007;overflow:hidden}.machine{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:320px;height:320px;border:8px solid #d4ac64;border-radius:50%;box-shadow:0 0 0 7px #5e7797,inset 0 10px 30px #c6f3ff29,inset 0 -15px 40px #050e2cbb,0 0 40px #d9a34b33;background:radial-gradient(circle at 35% 28%,#85c5e537,#19416141 44%,#0b1c3666 90%);overflow:hidden}.machine:after{content:'';pointer-events:none;position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,#ffffff44 0 8%,transparent 25% 78%,#fff2 93%)}.orbit{position:absolute;inset:0}.swirl{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 28% 24%,#ffe5e5,#ed455e 45%,#9a1939 97%);box-shadow:inset -6px -7px 10px #0004,0 4px 8px #0007;font-size:15px;font-weight:800;text-shadow:0 1px #0005;left:calc(50% - 21px);top:calc(50% - 21px);transform:translate(var(--x),var(--y));transition:transform .45s ease}.swirl.blue{background:radial-gradient(circle at 28% 24%,#dceeff,#398cef 50%,#174c99)}.machine.running .swirl{animation:spinball var(--dur) linear infinite;animation-delay:var(--delay)}@keyframes spinball{0%{transform:rotate(0deg) translateX(var(--radius)) rotate(0)}50%{transform:rotate(180deg) translateX(var(--radius)) rotate(-270deg)}100%{transform:rotate(360deg) translateX(var(--radius)) rotate(-360deg)}}.base{position:absolute;top:347px;left:50%;transform:translateX(-50%);width:380px;height:42px;border-radius:10px 10px 22px 22px;background:linear-gradient(#e8cb91,#9b7139 65%,#6a492b);border:3px solid #f1d9a7;box-shadow:0 8px 24px #0008}.chute{position:absolute;top:222px;left:calc(50% + 120px);width:190px;height:45px;border:5px solid #d0a763;transform:rotate(20deg);transform-origin:left center;border-radius:10px 22px 22px 10px;background:linear-gradient(160deg,#97cbde8f,#0d2343ad);overflow:visible;z-index:4}.chute .rolling{position:absolute;top:-3px;left:0;display:none;animation:rollout .68s ease-in forwards}@keyframes rollout{0%{left:0;transform:rotate(0deg) scale(.7);opacity:0}15%{opacity:1}100%{left:142px;transform:rotate(540deg) scale(1);opacity:1}}.ball{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 27% 22%,#ffdadd,#ec3a55 47%,#a61533 98%);box-shadow:inset -4px -5px 7px #0005,0 4px 10px #0006;color:#fff;font-weight:900;font-size:15px;border:1px solid #fff5}.ball.blue{background:radial-gradient(circle at 27% 22%,#daeaff,#318bf5 48%,#15458c 98%)}.panel{max-width:760px;margin:22px auto 0;background:#13233c;border:1px solid #384f70;border-radius:18px;padding:20px}.status{color:#f6d58d;min-height:23px;font-weight:700;margin-bottom:13px}.results{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;min-height:58px;align-items:center}.results .ball{width:52px;height:52px;font-size:20px;animation:pop .35s both}@keyframes pop{from{opacity:0;transform:translateY(-30px) scale(.6)}to{opacity:1;transform:translateY(0) scale(1)}}.slot{width:52px;height:52px;border:2px dashed #506682;border-radius:50%;display:grid;place-items:center;color:#607898}.sep{font-size:24px;color:#b1c7e2;margin:0 4px}.actions{margin-top:19px;display:flex;gap:14px;justify-content:center}.btn{font-size:17px;font-weight:800;border:0;border-radius:30px;padding:13px 34px;background:linear-gradient(#fce0a5,#dca650);color:#332313;cursor:pointer;box-shadow:0 5px 16px #0006}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.secondary{background:#274263;color:#dce9ff}.note{margin-top:16px;color:#8da3c5;font-size:13px}@media(max-width:650px){.stage{height:405px}.machine{width:260px;height:260px;top:35px}.base{top:305px;width:300px}.chute{top:230px;left:calc(50% + 93px);width:130px;height:39px}.chute .rolling{width:32px;height:32px}@keyframes rollout{from{left:0;transform:rotate(0) scale(.7);opacity:0}15%{opacity:1}to{left:86px;transform:rotate(540deg);opacity:1}}.swirl{width:34px;height:34px;font-size:12px;left:calc(50% - 17px);top:calc(50% - 17px)}.stage{overflow:hidden}.results .ball,.slot{width:39px;height:39px;font-size:15px}.results{gap:5px}.panel{padding:15px 8px}}

.history{max-width:760px;margin:18px auto 0;background:#13233c;border:1px solid #384f70;border-radius:18px;padding:18px;text-align:left}.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.history h2{margin:0;color:#ffe0a1;font-size:21px}.history-list{margin-top:13px;display:grid;gap:9px;max-height:350px;overflow:auto}.history-row{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:10px;border-radius:12px;background:#0b1a30;border:1px solid #2c4260}.history-row .ball{width:31px;height:31px;font-size:12px}.history-row small{color:#9fb4d2;margin-right:auto;min-width:100px}.mini{border:1px solid #527195;background:#203b5b;color:white;padding:7px 10px;border-radius:9px;cursor:pointer}.mini.danger{border-color:#74435a;color:#ffd0d6}.empty{color:#9fb4d2;text-align:center;padding:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#eac37a;color:#1a2233;padding:10px 20px;border-radius:22px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}.toast.show{opacity:1}.actions{flex-wrap:wrap}.history-row .plus{color:#adc4e3;font-weight:800}
</style></head><body><main class="wrap"><h1>🎱 双色球动态摇奖机</h1><p class="sub">真实滚动视觉 · 逐个出球 · 随机模拟选号</p><section class="stage"><div class="machine" id="machine"><div class="orbit" id="orbit"></div></div><div class="chute"><div class="ball rolling" id="rolling"></div></div><div class="base"></div></section><section class="panel"><div class="status" id="status">点击“开始摇奖”，见证 7 颗幸运球依次出场</div><div class="results" id="results"></div><div class="actions"><button class="btn" id="start">▶ 开始摇奖</button><button class="btn secondary" id="reset">↻ 重置</button><button class="btn secondary" id="copyCurrent" disabled>📋 复制本注</button></div></section><section class="history"><div class="history-head"><h2>📜 历史摇号记录 <span id="count" style="font-size:13px;color:#9fb4d2"></span></h2><div><button class="mini" id="copyAll">复制全部</button> <button class="mini danger" id="clearHistory">清空历史</button></div></div><div id="historyList" class="history-list"></div></section><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="note">按双色球规则：红球 01–33 随机不重复抽取 6 个，蓝球 01–16 随机抽取 1 个。仅供娱乐，不预测开奖结果。</div></main><script>
const orbit=document.querySelector('#orbit'),machine=document.querySelector('#machine'),out=document.querySelector('#results'),statusEl=document.querySelector('#status'),rolling=document.querySelector('#rolling'),start=document.querySelector('#start'),reset=document.querySelector('#reset');let running=false,token=0,currentNumbers=null;const key='ssq_draw_history_v3';let history=[];try{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))history=stored.filter(x=>Array.isArray(x.reds)&&x.reds.length===6&&Number.isInteger(x.blue)).slice(0,200)}catch(e){}const copyCurrent=document.querySelector('#copyCurrent'),historyList=document.querySelector('#historyList'),count=document.querySelector('#count'),toast=document.querySelector('#toast');let toastTimer;function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}function line(v){return v.reds.map(fmt).join(' ')+' + '+fmt(v.blue)}async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.focus();t.select();if(!document.execCommand('copy'))throw Error('copy failed');t.remove()}notify('✅ 已复制到剪贴板')}catch(e){notify('复制失败，请手动选择号码复制')}}function saveHistory(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){notify('浏览器存储不可用，记录仅本次有效')}}function renderHistory(){count.textContent=`（${history.length} 注）`;historyList.replaceChildren();if(!history.length){const e=document.createElement('div');e.className='empty';e.textContent='还没有记录，点击“开始摇奖”生成第一注';historyList.append(e);return}history.forEach((entry,index)=>{const row=document.createElement('div');row.className='history-row';const t=document.createElement('small');t.textContent=new Date(entry.time).toLocaleString('zh-CN',{hour12:false});row.append(t);entry.reds.forEach(n=>row.append(ball(n)));const plus=document.createElement('span');plus.className='plus';plus.textContent='+';row.append(plus,ball(entry.blue,true));const copy=document.createElement('button');copy.className='mini';copy.textContent='复制';copy.addEventListener('click',()=>copyText(line(entry)));row.append(copy);historyList.append(row)})}const sleep=ms=>new Promise(r=>setTimeout(r,ms));const fmt=n=>String(n).padStart(2,'0');
function pool(max){let a=Array.from({length:max},(_,i)=>i+1);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ball(n,blue=false){let d=document.createElement('div');d.className='ball'+(blue?' blue':'');d.textContent=fmt(n);return d}function slots(){out.replaceChildren();for(let i=0;i<6;i++){let s=document.createElement('div');s.className='slot';s.textContent='?';out.append(s)}let sep=document.createElement('div');sep.className='sep';sep.textContent='+';out.append(sep);let last=document.createElement('div');last.className='slot';last.textContent='?';out.append(last)}function setupOrbit(){orbit.replaceChildren();const radius=window.innerWidth<=650?91:116;for(let i=0;i<22;i++){let d=document.createElement('div');d.className='swirl'+(i%7===0?' blue':'');d.textContent=fmt(i+1);d.style.setProperty('--x',Math.round(Math.cos(i*2.4)*radius*.67)+'px');d.style.setProperty('--y',Math.round(Math.sin(i*2.4)*radius*.67)+'px');d.style.setProperty('--radius',Math.round(radius*(.38+.6*(i%5)/4))+'px');d.style.setProperty('--dur',(1.1+i%6*.19)+'s');d.style.setProperty('--delay',(-i*.17)+'s');orbit.append(d)}}
async function draw(){if(running)return;running=true;let current=++token;start.disabled=true;reset.disabled=true;slots();currentNumbers=null;copyCurrent.disabled=true;const reds=pool(33).slice(0,6),blue=pool(16)[0];machine.classList.add('running');statusEl.textContent='摇奖机启动，球体正在翻滚…';await sleep(1600);for(let i=0;i<7;i++){if(current!==token)return;let n=i<6?reds[i]:blue;let isBlue=i===6;statusEl.textContent=isBlue?'正在摇出蓝球…':`正在摇出第 ${i+1} 个红球…`;rolling.className='ball rolling'+(isBlue?' blue':'');rolling.textContent=fmt(n);rolling.style.display='grid';rolling.style.animation='none';void rolling.offsetWidth;rolling.style.animation='rollout .68s ease-in forwards';await sleep(760);if(current!==token)return;out.replaceChild(ball(n,isBlue),out.children[i<6?i:7]);rolling.style.display='none';await sleep(i===5?700:450)}machine.classList.remove('running');statusEl.textContent='🎉 摇奖完成！已自动保存到历史记录';currentNumbers={reds,blue,time:Date.now()};copyCurrent.disabled=false;history.unshift(currentNumbers);history=history.slice(0,200);saveHistory();renderHistory();start.disabled=false;reset.disabled=false;running=false}function doReset(){token++;currentNumbers=null;copyCurrent.disabled=true;running=false;start.disabled=false;reset.disabled=false;machine.classList.remove('running');rolling.style.display='none';statusEl.textContent='点击“开始摇奖”，见证 7 颗幸运球依次出场';slots()}start.addEventListener('click',draw);reset.addEventListener('click',doReset);copyCurrent.addEventListener('click',()=>{if(currentNumbers)copyText(line(currentNumbers))});document.querySelector('#copyAll').addEventListener('click',()=>{if(!history.length){notify('暂无记录');return}copyText(history.map((h,i)=>`${history.length-i}. ${line(h)}  ${new Date(h.time).toLocaleString('zh-CN')}`).join('\n'))});document.querySelector('#clearHistory').addEventListener('click',()=>{if(!history.length)return;if(confirm('确定清空全部历史摇号记录吗？此操作无法恢复。')){history=[];saveHistory();renderHistory();notify('历史记录已清空')}});setupOrbit();slots();renderHistory();
</script></body></html>
